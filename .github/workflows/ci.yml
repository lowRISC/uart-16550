name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-check:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Required so we can lint commit messages and diffs.

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install .
          rm -r *.egg-info

      - name: License check
        run: reuse lint

      - name: Commit metadata check
        if: ${{ github.event_name == 'pull_request' }}
        run: vendor/opentitan/ci/scripts/lint-commits.sh "$GITHUB_BASE_REF"
