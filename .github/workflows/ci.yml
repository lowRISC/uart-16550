name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-check:
    runs-on: ["self-hosted", "nixos", "X64"]

    steps:
      - uses: actions/checkout@v5

      - name: Lint
        run: nix run .#baremetal -- reuse lint
